<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - BloxGang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #111827;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
        }

        .box {
            background: #1f2937;
            padding: 50px 70px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.08);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        h3 {
            font-weight: normal;
            color: #cbd5e1;
            margin-bottom: 12px;
        }

        h2 {
            font-size: 2rem;
            font-weight: bold;
        }

        footer {
            margin-top: 30px;
            color: #9ca3af;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>We are currently down</h1>
        <h3>Expecting to return in</h3>
        <h2><strong>15/08/2026</strong></h2>
    </div>

    <footer>
        &copy;Copyright bloxgang
    </footer>

</body>
</html>
